<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>هذا الموقع ملك لل CTO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:"Aref Ruqaa",serif;
  background:#02030a;
  color:#fff;
}
.scene{
  width:100%;height:100vh;position:relative;overflow:hidden;
  display:grid;place-items:center;
  background:
    radial-gradient(circle at 50% 50%,#10152e 0%,#050713 42%,#010207 100%);
  perspective:1200px;
}
.aurora{
  position:absolute;inset:-25%;
  background:
    conic-gradient(from 180deg at 50% 50%,
      transparent 0deg,
      rgba(105,73,255,.18) 70deg,
      rgba(0,220,255,.12) 150deg,
      transparent 230deg,
      rgba(190,50,255,.12) 310deg,
      transparent 360deg);
  filter:blur(55px);
  animation:aurora 14s ease-in-out infinite alternate;
}
.orb{
  position:absolute;border-radius:50%;
  filter:blur(3px);mix-blend-mode:screen;
}
.o1{width:360px;height:360px;background:#633cff;left:-110px;top:-90px;animation:o1 9s ease-in-out infinite}
.o2{width:300px;height:300px;background:#00cfff;right:-80px;bottom:-70px;animation:o2 11s ease-in-out infinite}
.o3{width:120px;height:120px;background:#ff2bc2;left:17%;bottom:12%;opacity:.45;animation:o3 7s ease-in-out infinite}
.o4{width:90px;height:90px;background:#8b5cf6;right:19%;top:13%;opacity:.4;animation:o4 8s ease-in-out infinite}

.stars{
  position:absolute;inset:0;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1.5px),
    radial-gradient(circle,rgba(255,255,255,.5) 1px,transparent 1.5px);
  background-size:83px 83px,137px 137px;
  background-position:10px 20px,50px 70px;
  opacity:.16;
  animation:stars 18s linear infinite;
}
.grid{
  position:absolute;width:180%;height:75%;
  bottom:-38%;left:-40%;
  background-image:
    linear-gradient(rgba(125,110,255,.12) 1px,transparent 1px),
    linear-gradient(90deg,rgba(125,110,255,.12) 1px,transparent 1px);
  background-size:55px 55px;
  transform:rotateX(68deg);
  mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 70%,transparent);
  animation:grid 7s linear infinite;
}
.scan{
  position:absolute;width:100%;height:2px;
  top:-5px;background:linear-gradient(90deg,transparent,#bcaeff,transparent);
  box-shadow:0 0 30px #927cff;
  opacity:.35;
  animation:scan 6s linear infinite;
}

.card{
  position:relative;z-index:5;
  width:min(900px,88vw);height:min(520px,72vh);
  display:grid;place-items:center;text-align:center;
  border:1px solid rgba(255,255,255,.2);
  border-radius:38px;
  background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.025));
  backdrop-filter:blur(28px) saturate(145%);
  -webkit-backdrop-filter:blur(28px) saturate(145%);
  box-shadow:
    0 35px 100px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.2),
    inset 0 0 70px rgba(130,100,255,.035);
  transform-style:preserve-3d;
  animation:cardIn 1.1s cubic-bezier(.16,1,.3,1) both,cardFloat 6s ease-in-out 1.1s infinite;
}
.card:before{
  content:"";position:absolute;inset:-1px;border-radius:inherit;
  padding:1px;
  background:linear-gradient(120deg,rgba(255,255,255,.4),transparent 25%,transparent 70%,rgba(91,214,255,.4));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;
}
.glow{
  position:absolute;width:65%;height:45%;border-radius:50%;
  background:rgba(124,92,255,.18);filter:blur(70px);
  animation:glow 5s ease-in-out infinite;
}
.sweep{
  position:absolute;inset:-30%;
  background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.13) 50%,transparent 60%);
  transform:translateX(-100%) rotate(8deg);
  animation:sweep 5.5s ease-in-out 1.2s infinite;
}
.content{position:relative;z-index:3;padding:30px}
h1{
  margin:0;
  font-size:clamp(45px,8vw,94px);
  line-height:1.2;
  font-weight:700;
  letter-spacing:0;
  color:#fff;
  text-shadow:
    0 0 12px rgba(255,255,255,.3),
    0 0 40px rgba(133,101,255,.35);
  animation:title 3.5s ease-in-out infinite;
}
.underline{
  width:150px;height:3px;margin:25px auto 0;
  border-radius:99px;
  background:linear-gradient(90deg,transparent,#fff,#8f7aff,#fff,transparent);
  box-shadow:0 0 20px #806cff;
  animation:line 2.8s ease-in-out infinite;
}
.corner{
  position:absolute;width:85px;height:85px;opacity:.5;
  border-color:rgba(255,255,255,.35);border-style:solid;
}
.tl{top:18px;left:18px;border-width:1px 0 0 1px;border-radius:22px 0 0 0}
.tr{top:18px;right:18px;border-width:1px 1px 0 0;border-radius:0 22px 0 0}
.bl{bottom:18px;left:18px;border-width:0 0 1px 1px;border-radius:0 0 0 22px}
.br{bottom:18px;right:18px;border-width:0 1px 1px 0;border-radius:0 0 22px 0}

.particle{
  position:absolute;width:4px;height:4px;border-radius:50%;
  background:#fff;box-shadow:0 0 12px #fff;
  opacity:0;animation:particle 5s linear infinite;
}
.p1{left:20%;bottom:0;animation-delay:.2s}.p2{left:38%;bottom:0;animation-delay:1.5s}
.p3{left:61%;bottom:0;animation-delay:3s}.p4{left:78%;bottom:0;animation-delay:4s}
.p5{left:50%;bottom:0;animation-delay:2.2s}

@keyframes cardIn{from{opacity:0;transform:translateY(50px) rotateX(8deg) scale(.9);filter:blur(12px)}to{opacity:1;transform:translateY(0) rotateX(0) scale(1);filter:blur(0)}}
@keyframes cardFloat{50%{transform:translateY(-9px) rotateZ(.2deg)}}
@keyframes aurora{to{transform:rotate(25deg) scale(1.12)}}
@keyframes o1{50%{transform:translate(110px,80px) scale(1.18)}}
@keyframes o2{50%{transform:translate(-90px,-100px) scale(1.2)}}
@keyframes o3{50%{transform:translate(80px,-100px) scale(1.25)}}
@keyframes o4{50%{transform:translate(-70px,80px) scale(.75)}}
@keyframes stars{to{background-position:100px 140px,0 0}}
@keyframes grid{to{background-position:0 110px,0 0}}
@keyframes scan{to{top:105%}}
@keyframes sweep{0%,55%{transform:translateX(-100%) rotate(8deg)}75%,100%{transform:translateX(100%) rotate(8deg)}}
@keyframes glow{50%{transform:scale(1.25);opacity:.65}}
@keyframes title{50%{text-shadow:0 0 20px rgba(255,255,255,.45),0 0 65px rgba(133,101,255,.55)}}
@keyframes line{50%{width:230px;opacity:.65}}
@keyframes particle{0%{transform:translateY(0) scale(.2);opacity:0}15%{opacity:.8}100%{transform:translateY(-90vh) scale(1);opacity:0}}

@media(max-width:600px){
  .card{width:88vw;height:55vh;border-radius:28px}
  .content{padding:18px}
  h1{font-size:clamp(38px,11vw,65px)}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>
<div class="scene">
  <div class="aurora"></div>
  <div class="stars"></div>
  <div class="grid"></div>
  <div class="scan"></div>
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div>

  <span class="particle p1"></span><span class="particle p2"></span><span class="particle p3"></span>
  <span class="particle p4"></span><span class="particle p5"></span>

  <main class="card">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <div class="glow"></div>
    <div class="sweep"></div>
    <div class="content">
      <h1>هذا الموقع ملك لل CTO</h1>
      <div class="underline"></div>
    </div>
  </main>
</div>
</body>
</html>
